<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A19B"/>
      <stop offset="100%" stop-color="#00847f"/>
    </linearGradient>
  </defs>
  
  <!-- Base Background Plate -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#00A19B" stroke-width="8" stroke-opacity="0.35"/>
  
  <!-- YS Monogram -->
  <text 
    x="225" 
    y="330" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
    font-size="215" 
    font-weight="900" 
    letter-spacing="-10" 
    fill="#ffffff" 
    text-anchor="middle"
  >YS</text>
  
  <!-- Brand Teal Accent Dot -->
  <circle cx="375" cy="315" r="28" fill="url(#tealGrad)"/>
</svg>
